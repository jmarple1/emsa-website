# ============================================================
# EMS Alliance (EMSA) — Docker Compose
# Three services: postgres → backend → frontend (nginx + /api proxy)
# Rebuild everything with one command:  docker compose up --build -d
# ============================================================

name: emsa

services:

  # ----------------------------------------------------------
  # PostgreSQL database (for production you may use AWS RDS; see README)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-emsa}
      POSTGRES_USER:     ${DB_USER:-emsa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in app/.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-emsa_user} -d ${DB_NAME:-emsa}"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - internal

  # ----------------------------------------------------------
  # Drogon C++ backend (not exposed to the host; nginx proxies /api)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:                 postgres
      DB_PORT:                 5432
      DB_NAME:                 ${DB_NAME:-emsa}
      DB_USER:                 ${DB_USER:-emsa_user}
      DB_PASSWORD:             ${DB_PASSWORD}
      SERVER_PORT:             8080
      JWT_SECRET:              ${JWT_SECRET:?Set JWT_SECRET in app/.env}
      NALOXONE_RETENTION_DAYS: ${NALOXONE_RETENTION_DAYS:-30}
    volumes:
      - ./database/schema.sql:/app/schema.sql:ro
      - ./database/seed.sql:/app/seed.sql:ro
    networks:
      - internal

  # ----------------------------------------------------------
  # Angular frontend (nginx): serves the site, proxies /api → backend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - internal

volumes:
  pg_data:

networks:
  internal:
    driver: bridge
