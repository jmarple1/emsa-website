server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Forms are tiny; reject anything large before it reaches the backend.
    client_max_body_size 64k;

    # Security headers (repeated in each location below that adds its own
    # headers, because nginx drops inherited add_header lines there).
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin" always;
    add_header Permissions-Policy     "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # Only takes effect once served over HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Angular app: send every non-file path to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Naloxone requests: brief section 11 says we never store the requester's
    # IP, so this route is never written to the access log. X-Real-IP is still
    # passed so the backend can rate-limit on a hash kept only in memory.
    location = /api/naloxone-requests {
        access_log off;
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Everything else under /api goes to the Drogon backend
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build files never change, so cache them for a long time.
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /photos/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
