# ============================================================
# emsamu.site server blocks for the nginx that terminates HTTPS on the
# shared EC2 server (KnottSoDirtyCo's frontend container). Appended to
# ~/talbot/nginx-https.conf on the server by scripts/deploy.sh.
#
# That nginx proxies everything to EMSA's own nginx (container
# "emsa-frontend" on the shared "edge" Docker network), which serves the
# Angular app and proxies /api to the Drogon backend.
# ============================================================

server {
    listen 80;
    server_name emsamu.site www.emsamu.site;
    return 301 https://emsamu.site$request_uri;
}

server {
    listen 443 ssl;
    server_name www.emsamu.site;

    ssl_certificate     /etc/letsencrypt/live/emsamu.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emsamu.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://emsamu.site$request_uri;
}

server {
    listen 443 ssl;
    server_name emsamu.site;

    ssl_certificate     /etc/letsencrypt/live/emsamu.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emsamu.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    # Resolve the EMSA container at request time, so this nginx still starts
    # (and KnottSoDirty stays up) even if EMSA's containers are down.
    resolver 127.0.0.11 valid=30s;
    set $emsa http://emsa-frontend:80;

    # Brief section 11: never log the IP of someone requesting naloxone.
    location = /api/naloxone-requests {
        access_log off;
        proxy_pass       $emsa;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass       $emsa;
        proxy_set_header Host            $host;
        # Overwrite (don't append) so visitors can't fake their address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
